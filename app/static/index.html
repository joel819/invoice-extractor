<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Invoice Extractor</title>
<style>
  :root {
    --paper: #fff4dc; --card: #fffdf7; --ink: #1c1b33; --muted: #6a6780;
    --orange: #ff6a3d; --mint: #36d6a0; --lemon: #ffd43b; --lilac: #c3b1ff; --sky: #8fd3ff; --rose: #ff9aa2;
    --shadow: 4px 4px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 15px/1.55 ui-rounded, "Trebuchet MS", system-ui, sans-serif;
         background-color: var(--paper); background-image: radial-gradient(var(--ink) 0.8px, transparent 0.8px);
         background-size: 22px 22px; background-blend-mode: soft-light; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 16px 40px; display: grid;
          grid-template-columns: 290px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  header { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header > .meta { flex-basis: 100%; }
  .logo { width: 46px; height: 46px; display: grid; place-items: center; font-size: 24px; background: var(--lemon);
          border: 3px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow); transform: rotate(-6deg); }
  h1 { font: 800 30px/1 Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -.5px; }
  h1 span { background: linear-gradient(transparent 58%, var(--mint) 58%); padding: 0 4px; }
  h2 { font: 800 13px/1 ui-rounded, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .12em; margin: 0 0 12px; }
  .panel { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
  aside .panel + .panel { margin-top: 20px; }
  .badge { font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 99px; background: var(--mint);
           border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
  .badge.demo { background: var(--lemon); }
  .drop { border: 3px dashed var(--ink); border-radius: 14px; padding: 22px 12px; text-align: center; font-weight: 700;
          background: var(--lemon); cursor: pointer; transition: transform .12s; }
  .drop:hover { transform: rotate(-1.2deg) scale(1.02); }
  .drop.over { background: var(--mint); transform: scale(1.04); }
  button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 12px; border: 2px solid var(--ink);
           background: var(--card); color: var(--ink); padding: 6px 12px; box-shadow: 2px 2px 0 var(--ink);
           transition: transform .08s, box-shadow .08s; }
  button:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  .samples { background: var(--sky); }
  .samples button { display: block; width: 100%; text-align: left; margin-bottom: 8px; font-size: 13px; }
  .samples button:last-child { margin-bottom: 0; }
  .hist { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .hist li { padding: 8px 0; border-bottom: 2px dotted var(--ink); cursor: pointer; }
  .hist li:last-child { border-bottom: 0; }
  .hist li:hover { color: var(--orange); }
  .status { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 99px;
            border: 2px solid var(--ink); letter-spacing: .04em; }
  .status.ok { background: var(--mint); }
  .status.needs_review { background: var(--lemon); }
  .status.error { background: var(--rose); }
  .meta { font-size: 12px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 16px 0; }
  .field { border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; background: #fff; }
  .field.low { background: var(--lemon); box-shadow: 3px 3px 0 var(--orange); }
  .field .k { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .field .v { font-weight: 700; word-break: break-word; }
  .conf { font-variant-numeric: tabular-nums; }
  .low .conf { color: var(--ink); font-weight: 800; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; border: 2px solid var(--ink);
          border-radius: 12px; overflow: hidden; background: #fff; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--ink); }
  tbody tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; background: var(--lilac); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.low td { background: var(--lemon); }
  .flags { margin: 14px 0; display: grid; gap: 8px; }
  .flag { font-size: 14px; font-weight: 600; padding: 9px 12px; border-radius: 12px; border: 2px solid var(--ink); }
  .flag.error { background: var(--rose); }
  .flag.warning { background: var(--lemon); }
  .flag code { font-size: 12px; background: #fff; border: 1.5px solid var(--ink); border-radius: 6px; padding: 0 5px; }
  details { margin-top: 14px; }
  details summary { cursor: pointer; font-weight: 700; }
  details pre { white-space: pre-wrap; font-size: 12px; background: var(--paper); border: 2px solid var(--ink);
                padding: 10px; border-radius: 12px; max-height: 400px; overflow: auto; }
  .empty { color: var(--ink); font-weight: 700; padding: 60px 0; text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">🧾</div>
    <h1>Invoice <span>extractor</span></h1>
    <span id="mode" class="badge">loading…</span>
    <span class="meta">PDF in, validated JSON out. Low-confidence fields are highlighted.</span>
  </header>

  <aside>
    <div class="panel">
      <h2>Upload</h2>
      <div id="drop" class="drop">Drop a PDF invoice here<br><span class="meta" style="color:var(--ink)">or click to upload</span></div>
      <input id="file" type="file" accept="application/pdf,.pdf" hidden>
    </div>
    <div class="panel samples">
      <h2>Sample invoices</h2>
      <div id="samples"></div>
    </div>
    <div class="panel">
      <h2>History</h2>
      <ul id="hist" class="hist"></ul>
    </div>
  </aside>

  <main class="panel" id="result"><div class="empty">Upload a PDF or pick a sample invoice.</div></main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let THRESHOLD = 0.7;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(body.message || `Request failed (${r.status})`); e.body = body; e.status = r.status; throw e; }
  return body;
}

function field(label, path, value, conf) {
  if (value === null || value === undefined || value === "") return "";
  const c = conf[path];
  const low = c !== undefined && c < THRESHOLD;
  return `<div class="field ${low ? "low" : ""}"><div class="k"><span>${esc(label)}</span>${c !== undefined ? `<span class="conf">${Math.round(c * 100)}%</span>` : ""}</div><div class="v">${esc(value)}</div></div>`;
}

function render(r) {
  const inv = r.invoice, c = r.confidence, t = inv.totals;
  const lowRow = (i) => ["description", "quantity", "unit_price", "amount"].some((k) => (c[`line_items[${i}].${k}`] ?? 1) < THRESHOLD);
  const money = (v) => `${esc(v)} ${esc(inv.currency)}`;
  $("#result").innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="status ${r.status}">${r.status === "ok" ? "OK" : "NEEDS REVIEW"}</span>
      <b>${esc(r.filename)}</b>
      <span class="meta">${r.pages} page(s) · ${r.processing_ms} ms · ${esc(r.mode)} · #${r.id}</span>
    </div>
    ${r.flags.length ? `<div class="flags">${r.flags.map((f) => `<div class="flag ${f.severity}"><code>${esc(f.code)}</code> · ${esc(f.message)}</div>`).join("")}</div>` : ""}
    <div class="grid">
      ${field("Vendor", "vendor.name", inv.vendor.name, c)}
      ${field("Invoice number", "invoice_number", inv.invoice_number, c)}
      ${field("Invoice date", "invoice_date", inv.invoice_date, c)}
      ${field("Due date", "due_date", inv.due_date, c)}
      ${field("Currency", "currency", inv.currency, c)}
      ${field("Vendor tax ID", "vendor.tax_id", inv.vendor.tax_id, c)}
      ${field("Vendor email", "vendor.email", inv.vendor.email, c)}
      ${field("Vendor address", "vendor.address", inv.vendor.address, c)}
      ${field("Bill to", "bill_to", inv.bill_to, c)}
    </div>
    <table>
      <thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Amount</th></tr></thead>
      <tbody>${inv.line_items.map((li, i) => `<tr class="${lowRow(i) ? "low" : ""}"><td>${esc(li.description)}</td><td class="num">${esc(li.quantity)}</td><td class="num">${esc(li.unit_price)}</td><td class="num">${esc(li.amount)}</td></tr>`).join("")}</tbody>
    </table>
    <div class="grid">
      ${field("Subtotal", "totals.subtotal", money(t.subtotal), c)}
      ${t.discount !== "0.00" ? field("Discount", "totals.discount", money(t.discount), c) : ""}
      ${field(`Tax${t.tax_rate ? ` (${t.tax_rate}%)` : ""}`, "totals.tax", money(t.tax), c)}
      ${field("Total", "totals.total", money(t.total), c)}
    </div>
    <details><summary class="meta">Raw JSON response</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>`;
}

function renderError(e, name) {
  const b = e.body || {};
  $("#result").innerHTML = `
    <div style="display:flex;gap:10px;align-items:center"><span class="status error">REJECTED · ${e.status || ""}</span><b>${esc(name)}</b></div>
    <div class="flags"><div class="flag error"><code>${esc(b.error || "error")}</code> · ${esc(b.message || e.message)}</div></div>
    ${(b.details || []).length ? `<table><thead><tr><th>Field</th><th>Problem</th></tr></thead><tbody>${b.details.map((d) => `<tr><td>${esc(d.field)}</td><td>${esc(d.problem)}</td></tr>`).join("")}</tbody></table>` : ""}`;
}

async function upload(file) {
  $("#result").innerHTML = `<div class="empty">Extracting ${esc(file.name)}…</div>`;
  const fd = new FormData();
  fd.append("file", file, file.name);
  try { render(await api("/extract", { method: "POST", body: fd })); loadHistory(); }
  catch (e) { renderError(e, file.name); }
}

async function loadHistory() {
  const rows = await api("/extractions?limit=20");
  $("#hist").innerHTML = rows.map((r) => `<li data-id="${r.id}"><span class="status ${r.status}">${r.status === "ok" ? "OK" : "REVIEW"}</span> ${esc(r.vendor)}<br><span class="meta">${esc(r.invoice_number)} · ${esc(r.total)} ${esc(r.currency)}</span></li>`).join("") || '<li class="meta">Nothing yet.</li>';
}

$("#hist").addEventListener("click", async (e) => { const li = e.target.closest("li[data-id]"); if (li) render(await api(`/extractions/${li.dataset.id}`)); });
$("#samples").addEventListener("click", async (e) => {
  const name = e.target.dataset?.name; if (!name) return;
  const blob = await (await fetch(`/samples/${name}`)).blob();
  upload(new File([blob], name, { type: "application/pdf" }));
});
const drop = $("#drop");
drop.addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", (e) => e.target.files[0] && upload(e.target.files[0]));
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); });

(async () => {
  const h = await api("/health");
  $("#mode").textContent = h.demo_mode ? "Demo mode · rule-based" : `Live · ${h.extractor}`;
  $("#mode").classList.toggle("demo", h.demo_mode);
  const samples = await api("/samples");
  $("#samples").innerHTML = samples.map((s) => `<button data-name="${esc(s)}">${esc(s)}</button>`).join("");
  loadHistory();
})();
</script>
</body>
</html>
